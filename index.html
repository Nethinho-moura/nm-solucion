<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>NM SOLUCION - Controle de Chaves</title>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #eef2f7;
  margin: 0;
}
header {
  background: #0b3c5d;
  color: white;
  padding: 15px;
  text-align: center;
}
.container {
  padding: 20px;
}
.card {
  background: white;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 8px;
}
.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 10px;
}
input, button {
  padding: 8px;
  width: 100%;
}
button {
  background: #0b3c5d;
  color: white;
  border: none;
  cursor: pointer;
}
button:hover {
  background: #155a87;
}
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}
th, td {
  border: 1px solid #ccc;
  padding: 8px;
}
th {
  background: #0b3c5d;
  color: white;
}
.status {
  font-weight: bold;
}
.emdia { color: green; }
.vencido { color: red; }
.devolvido { color: gray; }
</style>
</head>

<body>

<header>
  <h1>NM SOLUCION - Controle de Chaves</h1>
</header>

<div class="container">

<div class="card">
  <h3>Empréstimo de Chave</h3>
  <div class="form-grid">
    <input id="nome" placeholder="Nome">
    <input id="empresa" placeholder="Empresa">
    <input id="funcao" placeholder="Função">
    <input id="chave" placeholder="Chave">
  </div>
  <br>
  <button onclick="emprestar()">Emprestar</button>
</div>

<div class="card">
  <button onclick="pdfAtrasados()">Relatório Atrasados (PDF)</button>
  <button onclick="pdfGeral()">Relatório Geral (PDF)</button>
</div>

<div class="card">
  <h3>Controle</h3>
  <table>
    <thead>
      <tr>
        <th>Nome</th>
        <th>Empresa</th>
        <th>Função</th>
        <th>Chave</th>
        <th>Status</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="tabela"></tbody>
  </table>
</div>

</div>

<script>
let dados = [];

async function carregar() {
  try {
    const res = await fetch('/dados');
    if (!res.ok) throw new Error();
    dados = await res.json();
  } catch {
    dados = [];
  }
  render();
}

async function salvar() {
  await fetch('/dados', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(dados)
  });
  render();
}

function emprestar() {
  if (!nome.value || !empresa.value || !funcao.value || !chave.value) {
    alert("Preencha todos os campos");
    return;
  }

  dados.push({
    nome: nome.value,
    empresa: empresa.value,
    funcao: funcao.value,
    chave: chave.value,
    data: new Date().toISOString(),
    devolvido: false
  });

  nome.value = empresa.value = funcao.value = chave.value = "";
  salvar();
}

function devolver(index) {
  dados[index].devolvido = true;
  salvar();
}

function excluir(index) {
  const senha = prompt("Digite a senha mestre:");
  if (senha === "2805") {
    dados.splice(index, 1);
    salvar();
  } else {
    alert("Senha incorreta");
  }
}

function render() {
  tabela.innerHTML = "";
  let agora = new Date();

  dados.forEach((d, index) => {
    let dataEmp = new Date(d.data);
    let prazo = new Date(dataEmp.getTime() + 48*60*60*1000);
    let vencido = !d.devolvido && agora > prazo;

    let status = d.devolvido ? "DEVOLVIDO" : (vencido ? "VENCIDO" : "EM DIA");
    let classe = d.devolvido ? "devolvido" : (vencido ? "vencido" : "emdia");

    let tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${d.nome}</td>
      <td>${d.empresa}</td>
      <td>${d.funcao}</td>
      <td>${d.chave}</td>
      <td class="status ${classe}">${status}</td>
      <td>
        ${!d.devolvido ? `<button onclick="devolver(${index})">Devolver</button>` : ""}
        <button onclick="excluir(${index})">Excluir</button>
      </td>
    `;
    tabela.appendChild(tr);
  });
}

function pdfAtrasados() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 10;
  let agora = new Date();

  doc.setFontSize(14);
  doc.text("NM SOLUCION - RELATÓRIO DE ATRASADOS", 10, y);
  y += 10;
  doc.setFontSize(10);

  dados.forEach(d => {
    let dataEmp = new Date(d.data);
    let prazo = new Date(dataEmp.getTime() + 48*60*60*1000);
    if (!d.devolvido && agora > prazo) {
      doc.text(`Nome: ${d.nome}`, 10, y); y+=5;
      doc.text(`Empresa: ${d.empresa}`, 10, y); y+=5;
      doc.text(`Função: ${d.funcao}`, 10, y); y+=5;
      doc.text(`Chave: ${d.chave}`, 10, y); y+=8;
    }
  });

  window.open(doc.output("bloburl"));
}

function pdfGeral() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 10;

  doc.setFontSize(14);
  doc.text("NM SOLUCION - RELATÓRIO GERAL", 10, y);
  y += 10;
  doc.setFontSize(10);

  dados.forEach(d => {
    let status = d.devolvido ? "DEVOLVIDO" : "EM ABERTO";
    doc.text(`Nome: ${d.nome}`, 10, y); y+=5;
    doc.text(`Empresa: ${d.empresa}`, 10, y); y+=5;
    doc.text(`Função: ${d.funcao}`, 10, y); y+=5;
    doc.text(`Chave: ${d.chave}`, 10, y); y+=5;
    doc.text(`Status: ${status}`, 10, y); y+=8;
  });

  window.open(doc.output("bloburl"));
}

window.onload = carregar;
</script>

</body>
</html>
